[package]
name = "fatir"
version = "1.1.1"
description = "Fatir - a resident personal assistant for Linux Mint"
authors = ["Muhammad Haseeb"]
edition = "2021"
license = "MIT"


[[bin]]
name = "fatir"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "net"] }
walkdir = "2"
sysinfo = "0.33"
dirs = "6"
keyring = "3"
base64 = "0.22"
mime_guess = "2"
mime = "0.3"
rfd = "0.15"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
regex = "1"
anyhow = "1"
axum = "0.7"


tokio-util = "0.7"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
