[package]
name = "fatir-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal cloud relay for Fatir Companion"

[[bin]]
name = "fatir-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
